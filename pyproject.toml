[project]
name = "pokecode"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Takanashi", email = "nao69alter@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "flask>=3.1.2",
    "lxml>=6.0.2",
    "lxml-stubs>=0.5.1",
    "openai>=2.17.0",
    "pillow>=12.1.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.0.0",
    "qrcode>=8.2",
    "requests>=2.32.5",
    "ruff>=0.14.14",
    "types-qrcode>=8.2.0.20250914",
    "types-requests>=2.32.4.20260107",
]

[project.scripts]
pokecode = "pokecode:main"

[tool.common]
host = "127.0.0.1"
port = "5000"

[tool.taskipy.tasks]
fmt = "ruff check --fix . && ruff format ."
main = "python -m pokecode.main"
debug = "python -m pokecode.debug.main"
server = "python -m server.app"

[tool.pokecode]
# ログ関連（環境変数 POKECODE_* で上書き可能）
logdir = "logs"
logfile = "app.log"
debug_logdir = "debug_log"
debug_logfile = "debug.log"

# ローカルサーバー URL（環境変数で上書き可能）
local_html_url = "http://localhost:5000"
local_json_url = "http://localhost:5000/json"

[tool.ruff]
# 3.14以上を対象とする
target-version = "py314"

# 行の最大数
line-length = 80

# チェック対象から除外するパス
exclude = [
    ".git",
    ".legacy",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.mypy]

python_version = "3.14"
strict = "true"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

exclude = [
    "^.venv/",
    "^venv/",
    "^__pycache__/",
    "^.mypy_cache/",
    "^.pytest_cache/",
    "^.ruff_cache/",
    "^build/",
    "^dist/",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.14.14",
    "taskipy>=1.14.1",
]
