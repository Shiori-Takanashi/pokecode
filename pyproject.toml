[project]
name = "pokecode"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Takanashi", email = "nao69alter@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "flask>=3.1.2",
    "mypy>=1.19.1",
    "openai>=2.17.0",
    "pillow>=12.1.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.0.0",
    "qrcode>=8.2",
    "requests>=2.32.5",
    "ruff>=0.14.14",
]

[project.scripts]
pokecode = "pokecode:main"

[tool.common]
host = "127.0.0.1"
port = "5000"

[tool.pokecode]
# ログ関連（環境変数 POKECODE_* で上書き可能）
logdir = "logs"
logfile = "app.log"
debug_logdir = "debug_log"
debug_logfile = "debug.log"

# ローカルサーバー URL（環境変数で上書き可能）
local_html_url = "http://localhost:5000"
local_json_url = "http://localhost:5000/json"

[tool.ruff]
# 3.14以上を対象とする
target-version = "py314"

# 行の最大数
line-length = 60

# チェック対象から除外するパス
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".legacy"
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]
