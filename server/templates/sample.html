<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>QR Sample Page</title>
</head>
<body>

<div class="container">
    <div class="card-body">

        <div class="card">
            <div class="card-body">
                <h2 class="card-title">📱 Friend Codes</h2>

                <div class="row">
                    <div class="col">
                        <img
                            src="{{ url_for('static', filename='imgs/japan.png') }}"
                            alt="Japan QR"
                        >
                        <button data-friend-code="1234-5678-9012">
                            Japan Trainer
                        </button>
                    </div>

                    <div class="col">
                        <img
                            src="{{ url_for('static', filename='imgs/united_states_of_america.png') }}"
                            alt="USA QR"
                        >
                        <button data-friend-code="9876-5432-1098">
                            USA Trainer
                        </button>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>
