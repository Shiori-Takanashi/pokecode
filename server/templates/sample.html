<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Sample Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='sample.css') }}">
</head>
<body>

<h1>Country QR Codes</h1>

<section id="countries">
    <div class="country" data-iso="JP">
        <span class="name">Japan</span>
        <img src="{{ url_for('static', filename='imgs/japan.png' )}}">
    </div>
    <div class="country" data-iso="US">
        <span class="name">America</span>
        <img src="{{ url_for('static', filename='imgs/united_states_of_america.png' )}}">
    </div>
</section>

</body>
</html>
